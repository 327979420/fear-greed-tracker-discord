name: Daily Fear & Greed Broadcast

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate preview without sending to Discord
        required: false
        default: false
        type: boolean
  schedule:
    # NYSE core session closes at 16:00 America/New_York.
    # We intentionally wait about two hours so CNN's Fear & Greed score has time
    # to settle on the day's closing value instead of broadcasting an intraday reading.
    # Later runs are fallbacks if GitHub delays or drops an individual schedule event.
    # Monday-Friday only; no weekend broadcasts.
    - cron: "5 18 * * 1-5"
      timezone: "America/New_York"
    - cron: "35 18 * * 1-5"
      timezone: "America/New_York"
    - cron: "5 19 * * 1-5"
      timezone: "America/New_York"
    - cron: "35 19 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: daily-fear-greed-broadcast
  cancel-in-progress: false

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install image dependencies and Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          python -m pip install -r requirements.txt

      - name: Check latest CNN delivery state
        id: guard
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          SNAPSHOT_DATE="$(python - <<'PY'
          from zoneinfo import ZoneInfo
          from src.fear_greed_bot import fetch_json, parse_snapshot

          snapshot = parse_snapshot(fetch_json())
          print(snapshot.timestamp.astimezone(ZoneInfo("America/New_York")).date().isoformat())
          PY
          )"
          LAST_SENT="$(cat .state/last_sent_date.txt 2>/dev/null || true)"
          SHOULD_SEND=true

          # Scheduled jobs can be delayed by GitHub for hours and may cross
          # midnight. Deduplicate using CNN's snapshot date, not runner time.
          if [[ "$EVENT_NAME" == "schedule" && "$LAST_SENT" == "$SNAPSHOT_DATE" ]]; then
            SHOULD_SEND=false
          fi

          echo "snapshot_date=$SNAPSHOT_DATE" >> "$GITHUB_OUTPUT"
          echo "should_send=$SHOULD_SEND" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN_INPUT" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT_NAME snapshot_date=$SNAPSHOT_DATE last_sent=$LAST_SENT should_send=$SHOULD_SEND"

      - name: Skip duplicate broadcast
        if: steps.guard.outputs.should_send != 'true'
        run: echo "Broadcast skipped because this CNN snapshot was already delivered."

      - name: Run tests for manual checks
        if: steps.guard.outputs.should_send == 'true' && github.event_name == 'workflow_dispatch'
        run: python -m unittest discover -s tests -v

      - name: Generate live card and broadcast to Discord
        if: steps.guard.outputs.should_send == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: ${{ steps.guard.outputs.dry_run }}
          OUTPUT_IMAGE_PATH: /tmp/fear-greed-card.png
          WEBHOOK_USERNAME: 市场情绪播报
        run: python src/fear_greed_bot.py

      - name: Record successful daily delivery
        if: steps.guard.outputs.should_send == 'true' && success() && steps.guard.outputs.dry_run != 'true'
        shell: bash
        run: |
          mkdir -p .state
          echo "${{ steps.guard.outputs.snapshot_date }}" > .state/last_sent_date.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .state/last_sent_date.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Fear & Greed broadcast ${{ steps.guard.outputs.snapshot_date }}"
            git push
          fi

      - name: Upload preview artifact
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: fear-greed-card-preview
          path: /tmp/fear-greed-card.png
          if-no-files-found: ignore
          retention-days: 3
