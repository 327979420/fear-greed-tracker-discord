name: Daily Fear & Greed Broadcast

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print payload without sending to Discord
        required: false
        default: false
        type: boolean
  schedule:
    # 00:30 UTC = 08:30 China Standard Time.
    # GitHub scheduled workflows can occasionally start several minutes late.
    - cron: "30 0 * * *"

permissions:
  contents: read

concurrency:
  group: daily-fear-greed-broadcast
  cancel-in-progress: false

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Broadcast to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          BROADCAST_TITLE: 美股 Fear & Greed 每日播报
          WEBHOOK_USERNAME: 市场情绪播报
        run: python src/fear_greed_bot.py
