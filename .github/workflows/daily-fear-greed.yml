name: Patch Broadcast Copy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update source and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/fear_greed_bot.py')
          text = source.read_text()
          old = '"content": f"美股情绪播报：{zone_label(snapshot.score)}区间{format_score(snapshot.score)}",'
          new = '"content": f"今日落入‘{zone_label(snapshot.score)}’区间：{format_score(snapshot.score)}",'
          if old not in text:
              raise SystemExit('Expected source text was not found')
          source.write_text(text.replace(old, new))

          tests = Path('tests/test_fear_greed_bot.py')
          test_text = tests.read_text()
          old_test = 'self.assertEqual(payload["content"], "美股情绪播报：贪婪区间58.2")'
          new_test = 'self.assertEqual(payload["content"], "今日落入‘贪婪’区间：58.2")'
          if old_test not in test_text:
              raise SystemExit('Expected test text was not found')
          tests.write_text(test_text.replace(old_test, new_test))
          PY

      - name: Run tests
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Commit the copy change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fear_greed_bot.py tests/test_fear_greed_bot.py
          git commit -m "Fix Discord broadcast copy"
          git push
