name: Apply meter vertical shift

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply meter vertical shift'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Shift meter lower while preserving zone labels
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/fear_greed_bot.py')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '    cx, cy = 520, 520\n': '    cx, cy = 520, 560\n',
              '    centered(draw, (cx, 392), "当前指数", font(21, True), COLORS["subtle"])\n': '    centered(draw, (cx, 430), "当前指数", font(21, True), COLORS["subtle"])\n',
              '    centered(draw, (cx, 500), format_score(snapshot.score), font(136, True), current_color)\n': '    centered(draw, (cx, 548), format_score(snapshot.score), font(136, True), current_color)\n',
              '    centered(draw, (cx, 640), zone_label(snapshot.score), font(58, True), current_color)\n': '    centered(draw, (cx, 682), zone_label(snapshot.score), font(58, True), current_color)\n',
              '    centered(draw, (cx, 700), snapshot.rating.upper(), font(24), COLORS["subtle"])\n': '    centered(draw, (cx, 738), snapshot.rating.upper(), font(24), COLORS["subtle"])\n',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected block not found: {old.strip()}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Send updated live preview to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OUTPUT_IMAGE_PATH: /tmp/fear-greed-card.png
          WEBHOOK_USERNAME: 市场情绪播报
        run: python src/fear_greed_bot.py

      - name: Commit result and remove temporary workflow
        run: |
          rm .github/workflows/apply-meter-downshift.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fear_greed_bot.py .github/workflows/apply-meter-downshift.yml
          git commit -m "Move meter lower and preserve zone labels"
          git push
