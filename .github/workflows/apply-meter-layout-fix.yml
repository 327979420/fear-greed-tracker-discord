name: Apply meter layout fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply meter layout fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch layout
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/fear_greed_bot.py')
          text = path.read_text(encoding='utf-8')

          old_ticks = '''        if tick % 25 == 0:
              centered(draw, (cx + math.cos(a) * 232, cy + math.sin(a) * 232), str(tick), font(16), COLORS["text"])
          '''
          new_ticks = '''        if tick in (0, 100):
              centered(draw, (cx + math.cos(a) * 242, cy + math.sin(a) * 242), str(tick), font(16), COLORS["text"])
          '''

          old_delta = '''    delta_text = change_text(snapshot.score, snapshot.previous_close)
          delta_color = COLORS["greed"] if delta_text.startswith("↑") else COLORS["extreme fear"] if delta_text.startswith("↓") else COLORS["subtle"]
          centered(draw, (cx, 752), f"较上一交易日 {delta_text}", font(18, True), delta_color)

          '''

          if old_ticks not in text:
              raise SystemExit('tick block not found')
          if old_delta not in text:
              raise SystemExit('delta block not found')

          text = text.replace(old_ticks, new_ticks, 1)
          text = text.replace(old_delta, '', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Commit result and remove temporary workflow
        run: |
          rm .github/workflows/apply-meter-layout-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fear_greed_bot.py .github/workflows/apply-meter-layout-fix.yml
          git commit -m "Remove overlapping meter labels"
          git push
