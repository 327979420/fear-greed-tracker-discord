name: Recover Missed Fear & Greed Broadcast

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: daily-fear-greed-broadcast
  cancel-in-progress: false

jobs:
  recover:
    if: github.event.head_commit.message == 'Trigger missed Fear & Greed recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether today was already delivered
        id: guard
        shell: bash
        run: |
          TODAY="$(TZ=Asia/Shanghai date +%F)"
          LAST_SENT="$(cat .state/last_sent_date.txt 2>/dev/null || true)"
          if [[ "$LAST_SENT" == "$TODAY" ]]; then
            echo "should_send=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_send=true" >> "$GITHUB_OUTPUT"
          fi
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.guard.outputs.should_send == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and Chinese fonts
        if: steps.guard.outputs.should_send == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          python -m pip install -r requirements.txt

      - name: Send recovery broadcast
        if: steps.guard.outputs.should_send == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: false
          OUTPUT_IMAGE_PATH: /tmp/fear-greed-card.png
          WEBHOOK_USERNAME: 市场情绪播报
        run: python src/fear_greed_bot.py

      - name: Record delivery and remove recovery workflow
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.guard.outputs.should_send }}" == "true" && "${{ job.status }}" == "success" ]]; then
            mkdir -p .state
            echo "${{ steps.guard.outputs.today }}" > .state/last_sent_date.txt
          fi
          rm -f .github/workflows/recover-missed-broadcast.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .state/last_sent_date.txt .github/workflows/recover-missed-broadcast.yml 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Complete missed Fear & Greed recovery"
            git push
          fi
